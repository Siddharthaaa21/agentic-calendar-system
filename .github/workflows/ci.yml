name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch/PR cancels in-flight runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Static checks — fast fail on syntax errors before installing anything heavy.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Byte-compile all sources
        run: python -m compileall -q backend/app frontend

      - name: Lint with ruff (non-blocking)
        run: |
          pip install ruff
          ruff check backend/app frontend || true

  # ---------------------------------------------------------------------------
  # 2. Regression — deterministic end-to-end conversation suite (demo mode).
  # ---------------------------------------------------------------------------
  regression:
    name: Chat regression
    runs-on: ubuntu-latest
    needs: lint
    env:
      DEMO_MODE: "true"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run chat regression
        working-directory: backend
        run: python -m app.testing.testing_chat_regression

  # ---------------------------------------------------------------------------
  # 3. Docker — prove both images build and the backend serves /health.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build & smoke
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          tags: axon-backend:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          tags: axon-frontend:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test backend health endpoint
        run: |
          docker run -d --name axon-backend -p 8000:8000 -e DEMO_MODE=true axon-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then
              echo "Backend healthy:"; curl -s http://127.0.0.1:8000/; echo
              docker rm -f axon-backend; exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time"; docker logs axon-backend; exit 1
